- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: SmokeMachine
  name: smoke machine
  description: A fan bolted to a heated mister. Fill its tank and switch it on, and it keeps breathing out a thin, see-through haze that carries whatever the tank holds.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Machines/smoke_machine.rsi
    layers:
    - state: off
      map: [ "enum.SmokeMachineVisuals.Running" ]
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SmokeMachineVisuals.Running:
        enum.SmokeMachineVisuals.Running:
          True: { state: on }
          False: { state: off }
  - type: WiresPanel
  - type: WiresVisuals
  - type: Anchorable
    delay: 4
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: SmokeMachine
  - type: SolutionManager
    solutions:
    - SolutionSmokeMachineTank
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  # It doesn't rotate, so it takes plumbing from every side.
  - type: PlumbingConnectorAppearance
    offset: 0.09375
  - type: AtmosPipeColor
  - type: PlumbingDevice
    updateInterval: 1
  - type: PlumbingInlet
    solutionName: tank
    inletNames:
    - inletNorth
    - inletEast
    - inletSouth
    - inletWest
    transferAmount: 10
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      inletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: ActivatableUI
    key: enum.SmokeMachineUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SmokeMachineUiKey.Key:
        type: SmokeMachineBoundUserInterface
  - type: Machine
    board: SmokeMachineMachineCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist

- type: entity
  parent: Solution
  id: SolutionSmokeMachineTank
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: tank
    solution:
      maxVol: 300

# Faint and not blocking sight, so people inside can still be seen.
- type: entity
  parent: BaseFoam
  id: SmokeMachineHaze
  name: haze
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    layers:
    - state: chemsmoke
      color: "#ffffff66"
  - type: TimedDespawn
    lifetime: 20
  - type: Tag
    tags:
    - HideContextMenu
  - type: SmokeMachineHaze
