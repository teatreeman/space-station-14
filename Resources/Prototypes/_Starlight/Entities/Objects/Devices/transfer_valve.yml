- type: entity
  parent: BaseItem
  id: TransferValve
  name: tank transfer valve
  description: A valve between two gas tank ports, with a slot for a trigger. Opening it pours the first tank into the second.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/transfer_valve.rsi
    layers:
    - state: generic
      map: [ "enum.TransferValveVisualLayers.TankTwo" ]
      offset: "-0.40625,0"
      visible: false
    - state: icon
      map: [ "enum.TransferValveVisualLayers.Base" ]
    - state: generic
      map: [ "enum.TransferValveVisualLayers.TankOne" ]
      visible: false
    - state: device
      map: [ "enum.TransferValveVisualLayers.Device" ]
      visible: false
    - state: cables
      map: [ "enum.TransferValveVisualLayers.Cables" ]
      visible: false
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: _Starlight/Objects/Devices/transfer_valve.rsi
    quickEquip: false
    slots: NONE
  - type: TransferValve
    valveSound:
      collection: TransferValveTurn
      params:
        volume: -6
    tankStates:
      OxygenTank: oxygen
      EmergencyOxygenTank: emergency
      EmergencyNitrogenTank: generic
      ExtendedEmergencyOxygenTank: emergency_engi
      ExtendedEmergencyNitrogenTank: generic
      DoubleEmergencyOxygenTank: emergency_double
      DoubleEmergencyNitrogenTank: generic
      NitrousOxideTank: anesthetic
      PlasmaTank: plasma
      JetpackBlue: jetpack
      JetpackBlack: jetpack-black
      JetpackCaptain: jetpack-captain
      JetpackMini: jetpack-mini
      JetpackSecurity: jetpack-sec
      JetpackVoid: jetpack-void
  - type: PayloadCase
    examinePayload: false
  - type: ItemSlots
    slots:
      tank_one:
        name: transfer-valve-slot-tank-one
        swap: false
        whitelist:
          tags:
          - GasTank
      tank_two:
        name: transfer-valve-slot-tank-two
        swap: false
        whitelist:
          tags:
          - GasTank
      payloadTrigger:
        name: transfer-valve-slot-trigger
        swap: false
        whitelist:
          components:
          - PayloadTrigger
  - type: ContainerContainer
    containers:
      tank_one: !type:ContainerSlot
      tank_two: !type:ContainerSlot
      payloadTrigger: !type:ContainerSlot
  - type: Appearance
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 25
