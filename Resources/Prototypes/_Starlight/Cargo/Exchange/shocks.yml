# Announced station events that move prices, as shares of a company's value, big enough to stand out from its normal
# swings. Only events the crew is told about belong here, so the market never gives away something hidden.

- type: exchangeShock
  id: MeteorsSmall
  rules: [ MeteorSwarmSmall ]
  headline: guild-exchange-shock-meteors-small
  shocks:
    Vulcan: -0.15
    MedTak: 0.075

- type: exchangeShock
  id: MeteorsMedium
  rules: [ MeteorSwarmMedium ]
  headline: guild-exchange-shock-meteors-medium
  shocks:
    Vulcan: -0.25
    MedTak: 0.125
    NanoTrasen: -0.075

- type: exchangeShock
  id: MeteorsLarge
  rules: [ MeteorSwarmLarge ]
