# Early warnings. Each first beat is easy to miss; a few minutes later it may turn into a real story, or into
# nothing. Every kind has its own lean, the same every round, so regular traders can learn which to act on.

# Usually bad news.
- type: exchangeStory
  id: CallDelay
  warning: guild-exchange-story-call-delay
  outcomes:
  - weight: 0.25
    headline: guild-exchange-story-call-delay-good
    shock: 1.2
  - weight: 0.45
    headline: guild-exchange-story-call-delay-bad
    shock: -1.6
  - weight: 0.3

